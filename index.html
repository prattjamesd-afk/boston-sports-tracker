<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boston Sports Tracker</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f17">

  <style>
    :root {
      --bg: #0D1B2A;
      /* Dark Navy */
      --card-bg: rgba(18, 26, 38, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(16px);
      --status-live: #00e676;
      --theme-redsox: #BD3039;
      /* Crimson */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }


    header {
      padding-top: 8px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--status-live);
      margin-bottom: 6px;
      cursor: pointer;
      user-select: none;
    }


    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--status-live);
      box-shadow: 0 0 8px var(--status-live);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #view-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      background-color: rgba(30, 41, 59, 0.85);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background-color: var(--theme-redsox);
      color: #ffffff;
      border-color: var(--theme-redsox);
    }

    #schedule-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background-color: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }


    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-name {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .game-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .matchup {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 4px;
    }


    .broadcast-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-radius: 6px;
      color: #ffffff;
      background-color: #334155;
    }

    .badge-nesn {
      background-color: rgba(185, 28, 28, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(185, 28, 28, 0.3);
    }

    .badge-nbcsb {
      background-color: rgba(4, 120, 87, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(4, 120, 87, 0.3);
    }

    .badge-peacock {
      background-color: rgba(2, 132, 199, 0.2);
      color: #7dd3fc;
      border: 1px solid rgba(2, 132, 199, 0.3);
    }

    .badge-espn {
      background-color: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.3);
    }

    .badge-cbs {
      background-color: rgba(29, 78, 216, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(29, 78, 216, 0.3);
    }

    .badge-tbd {
      background-color: rgba(71, 85, 105, 0.2);
      color: #cbd5e1;
      border: 1px solid rgba(71, 85, 105, 0.3);
    }

    .venue-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .badge-live {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

  </style>
</head>

<body>
  <div class="app-container">
    <header>
      <div class="live-indicator">
        <span class="pulse-dot"></span> Hub Sync Live
      </div>
      <h1>Boston Sports Tracker</h1>
      <p id="view-subtitle">Next 7 Days — All Teams</p>
    </header>

    <nav class="filter-bar" aria-label="Team Filters">
      <button class="filter-btn active" data-team="All">All (7 Days)</button>
      <button class="filter-btn" data-team="Red Sox">Red Sox</button>
      <button class="filter-btn" data-team="Celtics">Celtics</button>
      <button class="filter-btn" data-team="Bruins">Bruins</button>
      <button class="filter-btn" data-team="Patriots">Patriots</button>
    </nav>

    <main id="schedule-container">
      <div class="card">
        <div class="matchup">Loading schedules...</div>
      </div>
    </main>
  </div>

  <script>
    const container = document.getElementById('schedule-container');
    const subtitle = document.getElementById('view-subtitle');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let teamsPayload = [];

    function formatGameDate(dateStr) {
      if (!dateStr) return 'Date TBD';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      });
    }

    function getTeamColor(teamName) {
      const n = (teamName || '').toLowerCase();
      if (n.includes('sox')) return '#bd3039';
      if (n.includes('celtic')) return '#008348';
      if (n.includes('bruin')) return '#ffb81c';
      if (n.includes('patriot') || n.includes('pats')) return '#c60c30';
      return '#f8fafc';
    }

    function getBadgeClass(channel) {
      if (!channel) return 'badge-tbd';
      const c = channel.toUpperCase();
      if (c.includes('NESN')) return 'badge-nesn';
      if (c.includes('NBC SPORTS') || c.includes('NBCSB')) return 'badge-nbcsb';
      if (c.includes('PEACOCK') || c.includes('NBC')) return 'badge-peacock';
      if (c.includes('ESPN')) return 'badge-espn';
      if (c.includes('CBS')) return 'badge-cbs';
      return 'badge-tbd';
    }

    function renderView(teamFilter = 'All') {
      let displayGames = [];
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const isUpcoming = (game) => {
        if (!game || !game.date) return false;
        return new Date(game.date) >= startOfToday;
      };

      if (teamFilter === 'All') {
        subtitle.textContent = 'Next 7 Days — All Teams';
        const sevenDaysOut = new Date(startOfToday.getTime() + (7 * 24 * 60 * 60 * 1000));

        const allGames = teamsPayload.flatMap(t => {
          if (Array.isArray(t.games)) return t.games;
          if (t.gameName) return [t];
          return [];
        });

        displayGames = allGames
          .filter(g => {
            if (!g.date) return false;
            const gameDate = new Date(g.date);
            return gameDate >= startOfToday && gameDate <= sevenDaysOut;
          })
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        if (displayGames.length === 0) {
          subtitle.textContent = 'Upcoming Matchups — All Teams';
          displayGames = teamsPayload
            .map(t => {
              const list = Array.isArray(t.games) ? t.games : (t.gameName ? [t] : []);
              return list.find(isUpcoming) || null;
            })
            .filter(Boolean)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        }

      } else {
        const teamObj = teamsPayload.find(t => t.team === teamFilter);
        subtitle.textContent = `Next 3 Games — ${teamFilter} (Record: ${teamObj?.record || '0-0'})`;
        if (teamObj && teamObj.games) {
          const upcoming = (Array.isArray(teamObj.games) ? teamObj.games : []).filter(isUpcoming);
          displayGames = upcoming.slice(0, 3);
        }

      }



      if (!displayGames || displayGames.length === 0) {
        subtitle.textContent = teamFilter === 'All' ? 'Schedule Overview' : `${teamFilter} — Off-Season`;
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 28px 16px;">
            <div style="font-size: 1.75rem; margin-bottom: 8px;">⚾ ❄️</div>
            <div class="matchup" style="color: var(--text-muted); font-size: 1rem;">
              ${teamFilter === 'All' ? 'No games scheduled for this week' : `${teamFilter} are currently in the off-season`}
            </div>
            <div class="game-time" style="margin-top: 6px;">
              Check back closer to spring training and regular season announcements.
            </div>
          </div>`;
        return;
      }

      container.innerHTML = displayGames.map(game => {
        const channelName = game.broadcast || 'TBD';
        const badgeClass = getBadgeClass(channelName);
        const teamColor = getTeamColor(game.team);
        const isLive = game.status === 'in';

        return `
          <div class="card">
            <div class="card-header">
              <span class="team-name" style="color: ${teamColor}">${game.team}</span>
              <span class="game-time">🕒 ${formatGameDate(game.date)}</span>
            </div>
            <div class="matchup">${game.gameName}</div>
            <div class="card-footer">
              <div class="broadcast-container">
                <span class="badge ${badgeClass}">${channelName}</span>
                ${isLive ? '<span class="badge badge-live">LIVE</span>' : ''}
              </div>
              <div class="venue-meta">Schedule Feed</div>
            </div>
          </div>
        `;
      }).join('');

    }

    async function loadSchedule() {
      try {
        const res = await fetch('/api/games');
        teamsPayload = await res.json();
        renderView('All');
      } catch (err) {
        container.innerHTML = `
          <div class="card">
            <div class="matchup" style="color: #ef4444;">Failed to load schedule</div>
            <div class="game-time">${err.message}</div>
          </div>`;
      }
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderView(btn.dataset.team);
      });
    });

    loadSchedule();
  </script>
  <script>
  let swRegistration = null;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          swRegistration = reg;
          console.log('Service Worker registered:', reg.scope);
        })
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }

  // 1. Refresh whenever returning to the app from lock screen or app switcher
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (swRegistration) swRegistration.update();
      loadSchedule();
    }
  });

  // 2. Tap-to-refresh on the "HUB SYNC LIVE" pill
  const livePill = document.querySelector('.live-indicator');
  if (livePill) {
    livePill.addEventListener('click', () => {
      livePill.style.opacity = '0.5';
      if (swRegistration) swRegistration.update();
      loadSchedule().finally(() => {
        livePill.style.opacity = '1';
      });
    });
  }
</script>


</body>

</html>
