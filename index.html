<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boston Sports Tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f17">

  <style>
    :root {
      --bg: #0D1B2A;
      /* Dark Navy */
      --card-bg: rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(16px);
      --status-live: #00e676;
      --theme-redsox: #BD3039;
      /* Crimson */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -16px -16px 0;
      padding: 16px 16px 12px;
      background-color: rgba(13, 27, 42, 0.78);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }

    header {
      padding-top: 8px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--status-live);
      margin-bottom: 6px;
      cursor: pointer;
      user-select: none;
    }


    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--status-live);
      box-shadow: 0 0 8px var(--status-live);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #view-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 16px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn[data-team="Red Sox"] {
      background-color: rgba(189, 48, 57, 0.22);
      color: #fca5a5;
      border-color: rgba(189, 48, 57, 0.45);
    }

    .filter-btn[data-team="Celtics"] {
      background-color: rgba(0, 131, 72, 0.22);
      color: #6ee7b7;
      border-color: rgba(0, 131, 72, 0.45);
    }

    .filter-btn[data-team="Bruins"] {
      background-color: rgba(255, 184, 28, 0.2);
      color: #fde047;
      border-color: rgba(255, 184, 28, 0.45);
    }

    .filter-btn[data-team="Patriots"] {
      background-color: rgba(59, 130, 246, 0.22);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.45);
    }

    .filter-btn.active {
      background-color: #ffffff;
      color: #1f2937;
      border-color: #ffffff;
    }

    .filter-btn[data-team="Red Sox"].active {
      background-color: var(--theme-redsox);
      color: #ffffff;
      border-color: var(--theme-redsox);
    }

    .filter-btn[data-team="Celtics"].active {
      background-color: #008348;
      color: #ffffff;
      border-color: #008348;
    }

    .filter-btn[data-team="Bruins"].active {
      background-color: #ffb81c;
      color: #0D1B2A;
      border-color: #ffb81c;
    }

    .filter-btn[data-team="Patriots"].active {
      background-color: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }

    #schedule-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background-color: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: none;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }


    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-name {
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .game-time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .clock-icon {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .matchup {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 4px;
    }


    .broadcast-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-radius: 9999px;
      color: #ffffff;
      background-color: #334155;
    }

    .badge-nesn {
      background-color: rgba(185, 28, 28, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(185, 28, 28, 0.3);
    }

    .badge-nbcsb {
      background-color: rgba(4, 120, 87, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(4, 120, 87, 0.3);
    }

    .badge-peacock {
      background-color: rgba(2, 132, 199, 0.2);
      color: #7dd3fc;
      border: 1px solid rgba(2, 132, 199, 0.3);
    }

    .badge-espn {
      background-color: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.3);
    }

    .badge-cbs {
      background-color: rgba(29, 78, 216, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(29, 78, 216, 0.3);
    }

    .badge-tbd {
      background-color: rgba(71, 85, 105, 0.2);
      color: #cbd5e1;
      border: 1px solid rgba(71, 85, 105, 0.3);
    }

    .badge-live {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 10px 4px -2px;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .result-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .result-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .outcome-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      padding: 3px 7px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .outcome-w {
      background-color: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .outcome-l {
      background-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .outcome-otl {
      background-color: rgba(245, 158, 11, 0.2);
      color: #fde047;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .result-matchup {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    .result-date {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .result-right {
      text-align: right;
    }

    .result-score {
      font-size: 0.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .result-detail {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .standings-table th {
      text-align: right;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .standings-table th:first-child,
    .standings-table td:first-child {
      text-align: left;
      padding-left: 4px;
    }

    .standings-table td {
      text-align: right;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
    }

    .standings-table tr:last-child td {
      border-bottom: none;
    }

    .standings-table tr.is-boston td {
      font-weight: 700;
    }

    .standings-table tr.is-boston.boston-bruins td,
    .standings-table tr.is-boston.boston-bruins .standings-rank {
      background-color: rgba(255, 184, 28, 0.14);
      color: #ffb81c;
    }

    .standings-table tr.is-boston.boston-celtics td,
    .standings-table tr.is-boston.boston-celtics .standings-rank {
      background-color: rgba(0, 131, 72, 0.22);
      color: #6ee7b7;
    }

    .standings-table tr.is-boston.boston-patriots td,
    .standings-table tr.is-boston.boston-patriots .standings-rank {
      background-color: rgba(59, 130, 246, 0.22);
      color: #93c5fd;
    }

    .standings-table tr.is-boston.boston-redsox td,
    .standings-table tr.is-boston.boston-redsox .standings-rank {
      background-color: rgba(189, 48, 57, 0.22);
      color: #fca5a5;
    }

    .standings-table tr.is-boston .standings-rank {
      background-color: transparent;
      font-weight: 800;
    }

    .standings-table tr.is-boston td:first-child {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
    }

    .standings-table tr.is-boston td:last-child {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .standings-rank {
      display: inline-block;
      width: 18px;
      color: var(--text-muted);
      font-weight: 600;
    }

  </style>
</head>

<body>
  <div class="app-container">
    <div class="sticky-header">
      <header>
        <div class="live-indicator">
          <span class="pulse-dot"></span> Hub Sync Live
        </div>
        <h1>Boston Sports Tracker</h1>
        <p id="view-subtitle">Next 7 Days — All Teams</p>
      </header>

      <nav class="filter-bar" aria-label="Team Filters">
        <button class="filter-btn active" data-team="All">All (7 Days)</button>
        <button class="filter-btn" data-team="Red Sox">Red Sox</button>
        <button class="filter-btn" data-team="Celtics">Celtics</button>
        <button class="filter-btn" data-team="Bruins">Bruins</button>
        <button class="filter-btn" data-team="Patriots">Patriots</button>
      </nav>
    </div>

    <main id="schedule-container">
      <div class="card">
        <div class="matchup">Loading schedules...</div>
      </div>
    </main>
  </div>

  <script>
    const container = document.getElementById('schedule-container');
    const subtitle = document.getElementById('view-subtitle');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let teamsPayload = [];
    let activeFilter = 'All';

    function formatGameDate(dateStr) {
      if (!dateStr) return 'Date TBD';
      const d = new Date(dateStr);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
      const gameDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());

      const timePart = d.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });

      if (gameDay.getTime() === today.getTime()) {
        return `Today • ${timePart}`;
      }
      if (gameDay.getTime() === tomorrow.getTime()) {
        return `Tomorrow • ${timePart}`;
      }

      return d.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
      });
    }

    function getTeamColor(teamName) {
      const n = (teamName || '').toLowerCase();
      if (n.includes('sox')) return '#bd3039';
      if (n.includes('celtic')) return '#008348';
      if (n.includes('bruin')) return '#ffb81c';
      if (n.includes('patriot') || n.includes('pats')) return '#3b82f6';
      return '#f8fafc';
    }

    function getBadgeClass(channel) {
      if (!channel) return 'badge-tbd';
      const c = channel.toUpperCase();
      if (c.includes('NESN')) return 'badge-nesn';
      if (c.includes('NBC SPORTS') || c.includes('NBCSB')) return 'badge-nbcsb';
      if (c.includes('PEACOCK') || c.includes('NBC')) return 'badge-peacock';
      if (c.includes('ESPN')) return 'badge-espn';
      if (c.includes('CBS')) return 'badge-cbs';
      return 'badge-tbd';
    }

    function renderView(teamFilter = 'All') {
      let displayGames = [];
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const isUpcoming = (game) => {
        if (!game || !game.date) return false;
        return game.status === 'in' || new Date(game.date) >= startOfToday;
      };

      if (teamFilter === 'All') {
        subtitle.textContent = 'Next 7 Days — All Teams';
        const sevenDaysOut = new Date(startOfToday.getTime() + (7 * 24 * 60 * 60 * 1000));

        const allGames = teamsPayload.flatMap(t => {
          if (Array.isArray(t.games)) return t.games;
          if (t.gameName) return [t];
          return [];
        });

        displayGames = allGames
          .filter(g => {
            if (!g.date) return false;
            const gameDate = new Date(g.date);
            return g.status === 'in' || (gameDate >= startOfToday && gameDate <= sevenDaysOut);
          })
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        if (displayGames.length === 0) {
          subtitle.textContent = 'Upcoming Matchups — All Teams';
          displayGames = teamsPayload
            .map(t => {
              const list = Array.isArray(t.games) ? t.games : (t.gameName ? [t] : []);
              return list.find(isUpcoming) || null;
            })
            .filter(Boolean)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        }

      } else {
        const teamObj = teamsPayload.find(t => t.team === teamFilter);
        subtitle.textContent = `Next 3 Games — ${teamFilter} (Record: ${teamObj?.record || '0-0'})`;
        if (teamObj && teamObj.games) {
          const upcoming = (Array.isArray(teamObj.games) ? teamObj.games : []).filter(isUpcoming);
          displayGames = upcoming.slice(0, 3);
        }

      }



      let gamesHtml = '';

      if (!displayGames || displayGames.length === 0) {
        subtitle.textContent = teamFilter === 'All'
          ? 'Schedule Overview'
          : `${teamFilter} — Off-Season (Record: ${ teamsPayload.find(t => t.team === teamFilter)?.record || '0-0' })`;
        gamesHtml = `
          <div class="card" style="text-align: center; padding: 28px 16px;">
            <div style="font-size: 1.75rem; margin-bottom: 8px;">⚾ ❄️</div>
            <div class="matchup" style="color: var(--text-muted); font-size: 1rem;">
              ${teamFilter === 'All' ? 'No games scheduled for this week' : `${teamFilter} are currently in the off-season`}
            </div>
            <div class="game-time" style="margin-top: 6px; justify-content: center;">
              Check back closer to preseason and regular season announcements.
            </div>
          </div>`;
      } else {
        gamesHtml = displayGames.map(game => {
          const channelName = game.broadcast || 'TBD';
          const badgeClass = getBadgeClass(channelName);
          const teamColor = getTeamColor(game.team);
          const isLive = game.status === 'in';

          return `
            <div class="card">
              <div class="card-header">
                <span class="team-name" style="color: ${teamColor}">${game.team}</span>
                <span class="game-time">
                  <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path>
                  </svg>
                  <span>${formatGameDate(game.date)}</span>
                </span>
              </div>
              <div class="matchup">${game.gameName}</div>
              <div class="card-footer">
                <div class="broadcast-container">
                  <span class="badge ${badgeClass}">${channelName}</span>
                  ${isLive ? '<span class="badge badge-live">LIVE</span>' : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      let extraSectionsHtml = '';

      if (teamFilter !== 'All') {
        const teamObj = teamsPayload.find(t => t.team === teamFilter);
        const recent = teamObj?.recentResults || [];
        const standings = teamObj?.standings;
        const bostonRowClassMap = {
          'Red Sox': 'boston-redsox',
          'Celtics': 'boston-celtics',
          'Bruins': 'boston-bruins',
          'Patriots': 'boston-patriots'
        };
        const bostonThemeClass = bostonRowClassMap[teamFilter] || 'boston-bruins';

        if (recent.length > 0) {
          const rowsHtml = recent.map(r => {
            const shortDate = r.date
              ? new Date(r.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
              : '';
            const outcomeClass = r.outcome === 'W' ? 'outcome-w' : (r.outcome === 'OTL' ? 'outcome-otl' : 'outcome-l');
            return `
              <div class="result-row">
                <div class="result-left">
                  <span class="outcome-pill ${outcomeClass}">${r.outcome}</span>
                  <div>
                    <div class="result-matchup">${r.matchupLabel}</div>
                    <div class="result-date">${shortDate}</div>
                  </div>
                </div>
                <div class="result-right">
                  <div class="result-score">${r.scoreLabel}</div>
                  <div class="result-detail">${r.statusDetail}</div>
                </div>
              </div>
            `;
          }).join('');

          extraSectionsHtml += `
            <div class="section-title">Last 3 Results</div>
            <div class="card">
              <div class="results-list">${rowsHtml}</div>
            </div>
          `;
        }

        if (standings && Array.isArray(standings.rows) && standings.rows.length > 0) {
          const isNhl = standings.format === 'nhl';
          const theadHtml = isNhl
            ? `
                  <tr>
                    <th>Team</th>
                    <th>GP</th>
                    <th>W-L-OT</th>
                    <th>PTS</th>
                    <th>DIFF</th>
                    <th>STRK</th>
                  </tr>`
            : `
                  <tr>
                    <th>Team</th>
                    <th>W-L</th>
                    <th>PCT</th>
                    <th>GB</th>
                    <th>DIFF</th>
                    <th>STRK</th>
                  </tr>`;

          const tableRowsHtml = standings.rows.map(row => {
            const rowClass = row.isBoston ? `is-boston ${bostonThemeClass}` : '';
            if (isNhl) {
              return `
                <tr class="${rowClass}">
                  <td><span class="standings-rank">${row.rank}</span>${row.team}</td>
                  <td>${row.gp}</td>
                  <td>${row.w}-${row.l}-${row.otl}</td>
                  <td style="font-weight: 700;">${row.ptsDisplay}</td>
                  <td>${row.diff}</td>
                  <td>${row.strk}</td>
                </tr>
              `;
            }
            return `
              <tr class="${rowClass}">
                <td><span class="standings-rank">${row.rank}</span>${row.team}</td>
                <td style="font-weight: 700;">${row.record}</td>
                <td>${row.pctDisplay}</td>
                <td>${row.gb}</td>
                <td>${row.diff}</td>
                <td>${row.strk}</td>
              </tr>
            `;
          }).join('');

          extraSectionsHtml += `
            <div class="section-title">${standings.divisionName} Standings</div>
            <div class="card" style="padding: 14px 12px;">
              <table class="standings-table">
                <thead>${theadHtml}
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>
            </div>
          `;
        }
      }

      container.innerHTML = gamesHtml + extraSectionsHtml;

    }

    function updateSyncTime() {
      const livePill = document.querySelector('.live-indicator');
      if (livePill) {
        const timeStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        livePill.innerHTML = `<span class="pulse-dot"></span> Synced ${timeStr}`;
        livePill.style.opacity = '1';
      }
    }

    async function loadSchedule() {
      try {
        const res = await fetch(`/api/games?_t=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        teamsPayload = await res.json();
        renderView(activeFilter);
        updateSyncTime();
      } catch (err) {
        container.innerHTML = `
          <div class="card">
            <div class="matchup" style="color: #ef4444;">Failed to load schedule</div>
            <div class="game-time">${err.message}</div>
          </div>`;
      }
    }


    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.team;
        renderView(activeFilter);
      });
    });

    loadSchedule();
  </script>
  <script>
  let swRegistration = null;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          swRegistration = reg;
          console.log('Service Worker registered:', reg.scope);
        })
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }

  // 1. Refresh whenever returning to the app from lock screen or app switcher
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (swRegistration) swRegistration.update();
      loadSchedule();
    }
  });

  // 2. Tap-to-refresh on the "HUB SYNC LIVE" pill
  const livePill = document.querySelector('.live-indicator');
  if (livePill) {
    livePill.addEventListener('click', () => {
      livePill.style.opacity = '0.5';
      if (swRegistration) swRegistration.update();
      loadSchedule().finally(() => {
        livePill.style.opacity = '1';
      });
    });
  }
  // 3. Standalone iOS PWA Touch Pull-to-Refresh
  let touchStartY = 0;
  let isPulling = false;

  window.addEventListener('touchstart', (e) => {
    if (window.scrollY <= 0) {
      touchStartY = e.touches[0].clientY;
      isPulling = true;
    }
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (!isPulling) return;
    const pullDistance = e.touches[0].clientY - touchStartY;
    if (pullDistance > 60 && window.scrollY <= 0) {
      const pill = document.querySelector('.live-indicator');
      if (pill) pill.style.opacity = '0.5';
    }
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    if (!isPulling) return;
    const pullDistance = e.changedTouches[0].clientY - touchStartY;
    isPulling = false;

    if (pullDistance > 70 && window.scrollY <= 0) {
      const pill = document.querySelector('.live-indicator');
      if (pill) pill.style.opacity = '0.5';
      if (swRegistration) swRegistration.update();
      loadSchedule();
    } else {
      const pill = document.querySelector('.live-indicator');
      if (pill) pill.style.opacity = '1';
    }
  }, { passive: true });

</script>
